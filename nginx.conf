worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  localhost;

        # 安全头
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # ---------- 静态文件 ----------
        location / {
            root   html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Vite 打包的带 hash 资源，长期缓存
        location /assets/ {
            root   html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ---------- LX Music API ----------

        # SSE 长连接
        location /lx-api/subscribe-player-status {
            proxy_pass http://127.0.0.1:9527/subscribe-player-status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 普通 API 请求
        location /lx-api/ {
            proxy_pass http://127.0.0.1:9527/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # ---------- 第三方音乐平台评论 ----------

        # 酷我评论
        location /api-comment/kw/ {
            proxy_pass http://ncomment.kuwo.cn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # 酷我搜索
        location /api-search/ {
            proxy_pass http://search.kuwo.cn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }

        # 网易云评论
        location /api-wy-comment/ {
            proxy_pass https://music.163.com/;
            proxy_set_header Host music.163.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Referer "https://music.163.com/";
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }

        # 腾讯/QQ音乐评论
        location /api-tx-comment/ {
            proxy_pass https://u.y.qq.com/;
            proxy_set_header Host u.y.qq.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Referer "https://y.qq.com/";
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }

        # 酷狗评论
        location /api-kg-comment/ {
            proxy_pass http://m.comment.service.kugou.com/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }

        # 咪咕评论
        location /api-mg-comment/ {
            proxy_pass https://app.c.nf.migu.cn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }
    }
}
